name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      NODE_ENV: test
      # Architecture tests inspect the frontend without merging the repos.
      JEAN_CLIENT_DIR: jean-client
      # The integration suite downloads this local mongod and starts a
      # single-node replica set. No Atlas URI or repository secret is used.
      MONGOMS_VERSION: 8.2.6

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out frontend architecture fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeanClaude-pro/react_dieumerci
          # GITHUB_TOKEN is scoped to this backend repository and cannot read
          # the private frontend repository. Configure FRONTEND_REPO_TOKEN as
          # a fine-grained token with read-only Contents access to that repo.
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          ref: main
          path: jean-client
          persist-credentials: false
          sparse-checkout: |
            src/components/ReceiptScannerPage.tsx
            src/pages/NewSale.tsx
            src/pages/admin/AdminPanel.tsx
            src/pages/analytics/Analytics.tsx
            src/pages/history/SalesHistory.tsx
          sparse-checkout-cone-mode: false

      - name: Configure MongoDB binary directory
        run: echo "MONGOMS_DOWNLOAD_DIR=${{ runner.temp }}/mongodb-binaries" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and architecture tests
        run: npm test

      - name: Integration tests (ephemeral MongoDB replica set)
        run: npm run test:integration

      - name: Audit dependencies
        run: npm audit --audit-level=high
